<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Booking - Team A</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="booking.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            TEAM A
        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="booking.html" class="active">New Booking</a>
            <a href="queue.html">Queue</a>
            <a href="scheduler.html">Scheduler</a>
        </nav>

    </header>


    <!-- MAIN -->
    <main>

        <section class="page-title">

            <h1>New Booking</h1>

            <p>
                Create a new scheduling request.
            </p>

        </section>


        <!-- BOOKING FORM -->
        <section class="booking-box">

            <h2>Booking Request</h2>

            <p class="description">
                Enter the booking details below.
            </p>


            <form id="bookingForm">

                <!-- USER ID -->
                <div class="form-group">

                    <label for="userId">
                        Customer / User ID
                    </label>

                    <input
                        type="text"
                        id="userId"
                        placeholder="Example: USER004"
                        required>

                </div>


                <!-- PROVIDER -->
                <div class="form-group">

                    <label for="providerId">
                        Provider ID
                    </label>

                    <input
                        type="text"
                        id="providerId"
                        value="PROV001"
                        required>

                </div>


                <!-- SERVICE -->
                <div class="form-group">

                    <label for="serviceType">
                        Service Type
                    </label>

                    <select id="serviceType" required>

                        <option value="">
                            Select Service
                        </option>

                        <option value="Consultation">
                            Consultation
                        </option>

                        <option value="Checkup">
                            Checkup
                        </option>

                        <option value="Emergency">
                            Emergency
                        </option>

                        <option value="Follow-up">
                            Follow-up
                        </option>

                    </select>

                </div>


                <!-- DURATION -->
                <div class="form-group">

                    <label for="duration">
                        Duration
                    </label>

                    <select id="duration" required>

                        <option value="30">
                            30 Minutes
                        </option>

                        <option value="60">
                            60 Minutes
                        </option>

                        <option value="90">
                            90 Minutes
                        </option>

                    </select>

                </div>


                <!-- PRIORITY -->
                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" required>

                        <option value="LOW">
                            Low
                        </option>

                        <option value="MEDIUM">
                            Medium
                        </option>

                        <option value="HIGH">
                            High
                        </option>

                    </select>

                </div>


                <!-- PREFERRED WINDOW -->
                <div class="form-group">

                    <label for="preferredWindow">
                        Preferred Time
                    </label>

                    <select id="preferredWindow">

                        <option value="09:00-12:00">
                            09:00 AM - 12:00 PM
                        </option>

                        <option value="12:00-15:00">
                            12:00 PM - 03:00 PM
                        </option>

                        <option value="15:00-18:00">
                            03:00 PM - 06:00 PM
                        </option>

                    </select>

                </div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="booking-button">

                    Create Booking

                </button>

            </form>

        </section>


        <!-- RESULT -->
        <section
            class="booking-result"
            id="bookingResult">

            <h2>Booking Result</h2>

            <div id="resultContent">

                <p>
                    Submit a booking request to see the result.
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <p>
            Team A Scheduling Engine
        </p>

        <span>
            System Online ●
        </span>

    </footer>


    <script src="booking.js"></script>

</body>

</html>
